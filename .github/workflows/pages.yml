name: Deploy Mythborne Damage Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate live data snapshot
        run: python3 validate_data.py
      - name: Test combat systems
        run: node test-all.mjs
      - name: Build standalone site
        run: python3 build.py
      - name: Verify public artifact
        run: node public-artifact.test.mjs
      - name: Test public interface
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
